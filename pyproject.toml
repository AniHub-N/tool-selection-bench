[project]
name = "bench"
version = "0.1.0"
description = "Which web tool does an LLM agent pick, and was it the right pick?"
readme = "README.md"
authors = [
    { name = "AniHub-N", email = "anirudh092008@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "httpx==0.28.1",
    "litellm==1.108.3",
    "lxml-html-clean==0.4.6",
    "markdownify==1.2.3",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "pypdf==7.0.0",
    "python-dotenv==1.2.4",
    "readability-lxml==0.9",
    "tzdata==2026.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "respx==0.23.1",
]
